<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist 3-Color Calendar Icon: #0f172a, #2563eb, #ffffff -->

  <!-- Base Squircle (Color 1: #0f172a) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0f172a" />

  <!-- Top Banner (Color 2: #2563eb) -->
  <path d="M 32 128 C 32 75 75 32 128 32 L 384 32 C 437 32 480 75 480 128 L 480 160 L 32 160 Z" fill="#2563eb" />

  <!-- Binder Clips (Color 3: #ffffff) -->
  <rect x="144" y="56" width="32" height="64" rx="16" fill="#ffffff" />
  <rect x="336" y="56" width="32" height="64" rx="16" fill="#ffffff" />

  <!-- Bold Date Numeral (Color 3: #ffffff) -->
  <text x="256" y="356" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" text-anchor="middle" letter-spacing="-3">28</text>

  <!-- Accent Indicator Pill (Color 2: #2563eb) -->
  <rect x="216" y="404" width="80" height="12" rx="6" fill="#2563eb" />
</svg>
